name: Update profile art

# The boot-log card (boot.svg) is rebuilt every day with fresh contribution
# numbers, but it is NOT committed to main. It is published to a separate
# `output` branch that is overwritten on every run (always exactly one
# commit), and the README loads it from there. A push to main (e.g. after
# editing the log texts in scripts/bootlog.py) also rebuilds it right away.
"on":
  schedule:
    - cron: "17 6 * * *"   # ~03:17 in São Paulo
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

# shared with portrait.yml: runs queue instead of racing each other
concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3 pyfiglet==1.0.2
      - run: python scripts/fetch_contributions.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}
      - run: python scripts/bootlog.py boot.svg

      - name: Publish to the output branch (replaces it, no history)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/data"
          cp boot.svg "$out/"
          cp data/contributions.json "$out/data/"
          cd "$out"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "boot log $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
